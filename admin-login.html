<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Apna Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-1:#faf8f4; --bg-2:#f1ece1; --ink:#14213d; --gold:#c9a227; --gold-deep:#93710f;
        --glass-strong:rgba(255,255,255,0.78); --glass-border:rgba(255,255,255,0.9);
        --shadow:0 20px 60px rgba(20,33,61,0.10); --line:rgba(20,33,61,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background:linear-gradient(180deg,var(--bg-1),var(--bg-2)); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .blob{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
    .blob-gold{ width:420px; height:420px; background:rgba(212,175,55,0.30); top:-100px; right:-100px; }
    .blob-navy{ width:460px; height:460px; background:rgba(20,33,61,0.10); bottom:-100px; left:-100px; }
    
    .back-btn { position: absolute; top: 30px; left: 30px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: 1.1rem; z-index: 10; display: flex; align-items: center; gap: 8px; }
    
    .login-card { background: var(--glass-strong); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 90%; max-width: 400px; z-index: 1; text-align: center; }
    .login-card i { font-size: 40px; color: #b3441d; margin-bottom: 15px; }
    .login-card h2 { font-family: 'Fraunces', serif; font-size: 2rem; color: var(--ink); margin-bottom: 25px; }
    
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--ink); font-size: 0.95rem; }
    .input-group input { width: 100%; padding: 14px 15px; border-radius: 12px; border: 1px solid rgba(20,33,61,0.2); background: rgba(255,255,255,0.8); font-size: 1rem; color: var(--ink); outline: none; transition: 0.3s; }
    .input-group input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,0.2); }
    
    .submit-btn { width: 100%; background: #b3441d; color: white; padding: 15px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(179, 68, 29, 0.2); }
    .submit-btn:hover { background: #963514; transform: translateY(-2px); }
</style>
</head>
<body>
<div class="blob blob-gold"></div>
<div class="blob blob-navy"></div>

<a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

<div class="login-card">
    <i class="fas fa-user-shield"></i>
    <h2>Admin Access</h2>
    <div class="input-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter password" onkeypress="handleEnter(event)">
    </div>
    <button class="submit-btn" onclick="verifyAdmin()">Login</button>
</div>

<script>
    function handleEnter(e) {
        if(e.key === 'Enter') verifyAdmin();
    }

    function verifyAdmin() {
        const pass = document.getElementById('adminPass').value;
        if(pass === 'Janmejay@library') {
            // Browser memory me admin flag set kar diya
            localStorage.setItem('apnaLibraryAdmin', 'true');
            window.location.href = 'seat.html'; // Redirect to seat matrix
        } else {
            alert('Incorrect Password! Access Denied.');
            document.getElementById('adminPass').value = '';
        }
    }
</script>
</body>
</html>
