<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Seat Matrix | Apna Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-1:#faf8f4; --bg-2:#f1ece1; --ink:#14213d; --gold:#c9a227; --gold-deep:#93710f; --gold-soft:rgba(201,162,39,0.12);
        --glass-strong:rgba(255,255,255,0.78); --glass-border:rgba(255,255,255,0.9); --line:rgba(20,33,61,0.1);
        --vacant: #4ade80; --occupied: #facc15; --notmade: #d1d5db;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background:linear-gradient(180deg,var(--bg-1),var(--bg-2)); color: var(--ink); min-height: 100vh; position: relative; }
    
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; background: rgba(255,255,255,0.65); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); z-index: 1000; }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.2rem, 4vw, 1.6rem); color: var(--ink); font-weight: 800; }
    .logo span { color: var(--gold-deep); font-family: 'Poppins', sans-serif; font-size: 0.6rem; display: block; letter-spacing: 3px; }
    .menu-btn { font-size: 1.6rem; color: var(--gold-deep); cursor: pointer; background: none; border: none; transition: 0.3s; }

    .sidebar { position: fixed; top: 0; right: -340px; width: 310px; height: 100vh; background: rgba(255,255,255,0.85); backdrop-filter: blur(24px); border-left: 1px solid var(--glass-border); transition: 0.4s ease; z-index: 2000; padding: 40px 20px; box-shadow: -20px 0 60px rgba(20,33,61,0.12); }
    .sidebar.active { right: 0; }
    .close-btn { font-size: 1.8rem; color: var(--ink); cursor: pointer; float: right; margin-bottom: 30px; }
    .sidebar-links { display: flex; flex-direction: column; gap: 10px; clear: both; }
    .sidebar-links a { color: var(--ink); text-decoration: none; font-size: 1rem; padding: 12px 14px; border-radius:12px; display: flex; align-items: center; gap: 14px; transition: 0.25s; }
    .sidebar-links a:hover { color: var(--gold-deep); background: var(--gold-soft); }

    .page-content { padding: 110px 5% 50px; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
    .title h1 { font-family: 'Fraunces', serif; font-size: 2.2rem; }
    
    .logout-btn { display: none; background: #b3441d; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; color: white; transition: 0.3s; }
    .logout-btn:hover { background: #963514; }

    .legend { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; background: var(--glass-strong); padding: 15px; border-radius: 16px; border: 1px solid var(--glass-border); }
    .legend-item { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.95rem; }
    .box { width: 20px; height: 20px; border-radius: 6px; }
    .box.vacant { background: var(--vacant); border: 1px solid #22c55e;}
    .box.occupied { background: var(--occupied); border: 1px solid #eab308;}
    .box.notmade { background: var(--notmade); border: 1px solid #9ca3af;}

    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(65px, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto; }
    .seat { aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.1rem; color: #111; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); user-select: none; }
    
    .seat.vacant { background: var(--vacant); border: 2px solid #22c55e; }
    .seat.occupied { background: var(--occupied); border: 2px solid #eab308; }
    .seat.notmade { background: var(--notmade); color: #6b7280; border: 2px solid #9ca3af; }
    
    .seat:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }

    /* Admin Action Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .modal { background: white; padding: 30px; border-radius: 20px; width: 300px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    .modal h3 { margin-bottom: 20px; font-family: 'Playfair Display', serif; font-size: 1.5rem; }
    .modal button { width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.2s; }
    .btn-vacant { background: #dcfce7; color: #166534; border: 1px solid #4ade80;}
    .btn-vacant:hover { background: #4ade80; color: #fff;}
    .btn-occupied { background: #fef08a; color: #854d0e; border: 1px solid #facc15;}
    .btn-occupied:hover { background: #facc15; color: #fff;}
    .btn-notmade { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;}
    .btn-notmade:hover { background: #d1d5db; }
    .btn-close { background: white; color: red; border: 1px solid red !important; margin-top: 10px; }
    .btn-close:hover { background: red; color: white; }
</style>
</head>
<body>

<nav>
    <div class="logo">APNA <span>LIBRARY</span></div>
    <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
</nav>

<div class="sidebar" id="sidebar">
    <i class="fas fa-times close-btn" onclick="toggleSidebar()"></i>
    <div class="sidebar-links">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="seat.html" style="color: var(--gold-deep); background: var(--gold-soft);"><i class="fas fa-chair"></i> Live Seat Matrix</a>
        <a href="enquiry.html"><i class="fas fa-paper-plane"></i> Book a Seat</a>
        <a href="papers.html"><i class="fa-solid fa-file-lines"></i> CBSE Papers</a>
        <a href="ebook.html"><i class="fa-solid fa-book"></i> NCERT E-Books</a>
        <a href="curricular.html"><i class="fa-solid fa-book-open-reader"></i> CBSE Curricular</a>
        <a href="digilocker.html"><i class="fa-solid fa-cloud-arrow-down"></i> DigiLocker</a>
        <a href="pariksha.html"><i class="fa-solid fa-laptop-file"></i> Pariksha Sangam</a>
        <a href="cbse.html"><i class="fa-solid fa-globe"></i> CBSE Official</a>
        <hr style="border-color: var(--line); margin: 5px 0;">
        <a href="admin-login.html" style="color: #b3441d;"><i class="fas fa-user-shield"></i> Admin Login</a>
    </div>
</div>

<div class="page-content">
    <div class="header-bar">
        <div class="title">
            <h1>Apna Library Seat Matrix</h1>
        </div>
        <button class="logout-btn" id="logoutBtn" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout Admin</button>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="box vacant"></div> Available</div>
        <div class="legend-item"><div class="box occupied"></div> Occupied</div>
        <div class="legend-item"><div class="box notmade"></div> Blocked / Not Made</div>
    </div>

    <div class="grid-container" id="seatGrid"></div>
</div>

<div class="modal-overlay" id="actionModal">
    <div class="modal">
        <h3 id="modalTitle">Seat #</h3>
        <button class="btn-vacant" onclick="updateSeat('vacant')">Mark as Vacant</button>
        <button class="btn-occupied" onclick="updateSeat('occupied')">Mark as Occupied</button>
        <button class="btn-notmade" onclick="updateSeat('notmade')">Mark as Blocked</button>
        <button class="btn-close" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

    const TOTAL_SEATS = 100;
    let isAdmin = localStorage.getItem('apnaLibraryAdmin') === 'true'; // Check if logged in via admin-login.html
    let currentSeatId = null;

    if (isAdmin) {
        document.getElementById('logoutBtn').style.display = 'inline-flex';
    }

    function logoutAdmin() {
        localStorage.removeItem('apnaLibraryAdmin');
        window.location.reload();
    }

    let seatData = JSON.parse(localStorage.getItem('apnaLibrarySeats'));
    if (!seatData) {
        seatData = Array(TOTAL_SEATS).fill('vacant'); 
        for(let i = 90; i < 100; i++) seatData[i] = 'notmade';
        saveData();
    }

    const grid = document.getElementById('seatGrid');
    const modal = document.getElementById('actionModal');

    function renderGrid() {
        grid.innerHTML = '';
        seatData.forEach((status, index) => {
            const seatNum = index + 1;
            const div = document.createElement('div');
            div.className = `seat ${status}`;
            div.innerText = seatNum;
            
            // Logic for clicking a seat
            div.onclick = () => {
                if(isAdmin) {
                    currentSeatId = index;
                    document.getElementById('modalTitle').innerText = `Edit Seat ${seatNum}`;
                    modal.style.display = 'flex';
                } else {
                    if(status === 'vacant') {
                        // Agar student vacant pe click kare toh sidha book karne wale page pe bhej do
                        window.location.href = 'enquiry.html';
                    } else if (status === 'occupied') {
                        alert("This seat is currently occupied.");
                    } else {
                        alert("This seat is under maintenance / not available.");
                    }
                }
            };
            grid.appendChild(div);
        });
    }

    function updateSeat(newStatus) {
        if(currentSeatId !== null) {
            seatData[currentSeatId] = newStatus;
            saveData();
            renderGrid();
            closeModal();
        }
    }

    function closeModal() {
        modal.style.display = 'none';
        currentSeatId = null;
    }

    function saveData() {
        localStorage.setItem('apnaLibrarySeats', JSON.stringify(seatData));
    }

    renderGrid();
</script>
</body>
</html>
