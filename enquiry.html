<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Seat | Apna Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-1:#faf8f4; --bg-2:#f1ece1; --ink:#14213d; --gold:#c9a227; --gold-deep:#93710f; --gold-soft:rgba(201,162,39,0.12);
        --glass-strong:rgba(255,255,255,0.78); --glass-border:rgba(255,255,255,0.9);
        --shadow:0 20px 60px rgba(20,33,61,0.10); --line:rgba(20,33,61,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background:linear-gradient(180deg,var(--bg-1),var(--bg-2)); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; align-items: center; position: relative; }
    .blob{ position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; }
    .blob-gold{ width:420px; height:420px; background:rgba(212,175,55,0.30); top:-100px; right:-100px; }
    .blob-navy{ width:460px; height:460px; background:rgba(20,33,61,0.10); bottom:-100px; left:-100px; }
    
    nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 18px 5%; background: rgba(255,255,255,0.65); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); z-index: 1000; }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(1.2rem, 4vw, 1.6rem); color: var(--ink); font-weight: 800; }
    .logo span { color: var(--gold-deep); font-family: 'Poppins', sans-serif; font-size: 0.6rem; display: block; letter-spacing: 3px; }
    .menu-btn { font-size: 1.6rem; color: var(--gold-deep); cursor: pointer; background: none; border: none; transition: 0.3s; }

    .sidebar { position: fixed; top: 0; right: -340px; width: 310px; height: 100vh; background: rgba(255,255,255,0.85); backdrop-filter: blur(24px); border-left: 1px solid var(--glass-border); transition: 0.4s ease; z-index: 2000; padding: 40px 20px; box-shadow: -20px 0 60px rgba(20,33,61,0.12); }
    .sidebar.active { right: 0; }
    .close-btn { font-size: 1.8rem; color: var(--ink); cursor: pointer; float: right; margin-bottom: 30px; }
    .sidebar-links { display: flex; flex-direction: column; gap: 10px; clear: both; }
    .sidebar-links a { color: var(--ink); text-decoration: none; font-size: 1rem; padding: 14px; border-radius:12px; display: flex; align-items: center; gap: 14px; transition: 0.25s; }
    .sidebar-links a:hover { color: var(--gold-deep); background: var(--gold-soft); }

    .page-content { width: 100%; display: flex; justify-content: center; z-index: 1; margin-top: 120px; padding-bottom: 50px; }

    .form-container { background: var(--glass-strong); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; box-shadow: var(--shadow); width: 90%; max-width: 500px; }
    .form-header { text-align: center; margin-bottom: 30px; }
    .form-header h2 { font-family: 'Fraunces', serif; font-size: 2.2rem; color: var(--ink); }
    .form-header p { color: #666; font-size: 0.95rem; margin-top: 5px; }

    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--ink); font-size: 0.95rem; }
    .input-group input, .input-group select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(20,33,61,0.2); background: rgba(255,255,255,0.8); font-size: 1rem; color: var(--ink); outline: none; transition: 0.3s; }
    .input-group input:focus, .input-group select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,0.2); }
    
    .price-tag { display: block; font-size: 0.85rem; color: var(--gold-deep); margin-top: 5px; font-weight: 600; }

    .submit-btn { width: 100%; background: #25D366; color: white; padding: 15px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; margin-top: 10px; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); }
    .submit-btn:hover { background: #1ebe57; transform: translateY(-2px); }
</style>
</head>
<body>
<div class="blob blob-gold"></div>
<div class="blob blob-navy"></div>

<nav>
    <div class="logo">APNA <span>LIBRARY</span></div>
    <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
</nav>

<div class="sidebar" id="sidebar">
    <i class="fas fa-times close-btn" onclick="toggleSidebar()"></i>
    <div class="sidebar-links">
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="seat.html"><i class="fas fa-chair"></i> Live Seat Matrix</a>
        <a href="enquiry.html" style="color: var(--gold-deep); background: var(--gold-soft);"><i class="fas fa-paper-plane"></i> Book a Seat</a>
        <a href="papers.html"><i class="fa-solid fa-file-lines"></i> CBSE Papers</a>
        <a href="ebook.html"><i class="fa-solid fa-book"></i> NCERT E-Books</a>
        <a href="curricular.html"><i class="fa-solid fa-book-open-reader"></i> CBSE Curricular</a>
        <a href="digilocker.html"><i class="fa-solid fa-cloud-arrow-down"></i> DigiLocker</a>
        <a href="pariksha.html"><i class="fa-solid fa-laptop-file"></i> Pariksha Sangam</a>
        <a href="cbse.html"><i class="fa-solid fa-globe"></i> CBSE Official</a>
    </div>
</div>

<div class="page-content">
    <div class="form-container">
        <div class="form-header">
            <h2>Book a Seat</h2>
            <p>Fill the details to send your enquiry via WhatsApp.</p>
        </div>

        <form id="enquiryForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label for="prep">Preparation For (Exam)</label>
                <input type="text" id="prep" placeholder="e.g., UPSC, JEE, NEET, SSC" required>
            </div>

            <div class="input-group">
                <label for="shift">Select Timing / Shift</label>
                <select id="shift" required onchange="updatePrice()">
                    <option value="" disabled selected>Choose your shift</option>
                    <option value="Morning (6 AM - 1 PM)">Morning Shift (6 AM - 1 PM)</option>
                    <option value="Evening (1 PM - 8 PM)">Evening Shift (1 PM - 8 PM)</option>
                    <option value="Full Day (24 Hours)">Full Day (24 Hours)</option>
                </select>
                <span class="price-tag" id="priceDisplay"></span>
            </div>

            <button type="submit" class="submit-btn"><i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> Send Enquiry</button>
        </form>
    </div>
</div>

<script>
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

    function updatePrice() {
        const shift = document.getElementById('shift').value;
        const priceDisplay = document.getElementById('priceDisplay');
        if(shift.includes('Morning') || shift.includes('Evening')) {
            priceDisplay.innerHTML = '<i class="fas fa-tag"></i> Monthly Fee: ₹600';
        } else if (shift.includes('Full Day')) {
            priceDisplay.innerHTML = '<i class="fas fa-tag"></i> Monthly Fee: ₹1000';
        } else {
            priceDisplay.innerHTML = '';
        }
    }

    document.getElementById('enquiryForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const prep = document.getElementById('prep').value;
        const shift = document.getElementById('shift').value;
        const priceText = document.getElementById('priceDisplay').innerText;
        
        const message = `*Apna Library - New Enquiry* %0A%0A*Name:* ${name} %0A*Preparing for:* ${prep} %0A*Shift:* ${shift} %0A*Fee Noted:* ${priceText.replace('Monthly Fee: ', '')} %0A%0AHi, I would like to book a seat. Please let me know the availability.`;
        
        const whatsappUrl = `https://wa.me/917570872901?text=${message}`;
        window.open(whatsappUrl, '_blank');
    });
</script>
</body>
</html>
